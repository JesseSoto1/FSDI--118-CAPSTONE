<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }}</title>
</head>

<body>

    <h1>{{ post.title }}</h1>

    <p>
        By {{ post.author.username }}
    </p>

    <p>
        {{ post.created_at }}
    </p>

    <hr>

    <p>
        {{ post.content }}
    </p>

    <br>

    <a href="{% url 'post_list' %}">
        Back to Main
    </a>

</body>
</html>
