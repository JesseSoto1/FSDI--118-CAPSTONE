{% extends 'base.html' %}
{% load static %}

{% block content %}


<body>

    <h1>{{ post.title }}</h1>

    <p>
        By {{ post.author.username }}
    </p>

    <p>
        {{ post.created_at }}
    </p>

    <hr>

    <p>
        {{ post.content }}
        {% if post.image %}
            <img width="300" src="{{ post.image.url }}" alt="Post image">
        {% endif %}
    </p>

    <br>

    <a href="{% url 'post_list' %}">
        Back to Main
    </a>

</body>

{% endblock %}
