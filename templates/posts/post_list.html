{% extends 'base.html' %}



{% block content %}

<div class="feed">
    <h1>Feed</h1>

    {% for post in posts %}

        <article>
            <h2>
                <a href="{% url 'post_detail' post.pk %}">
                {{ post.title }}
                </a>
            </h2

            <p>
                By {{ post.author.username }}
            </p>
            
            <p>
                {{ post.content }}
                {% if post.image %}
                    <img width="300" src="{{ post.image.url }}" alt="Post image">
                {% endif %}
            </p>
            
            <p>
                Posted on {{ post.created_at }}
            </p>
        </article>

        <hr>

    {% empty %}

        <p>No posts yet.</p>

    {% endfor %}


</div>

{% endblock %}
