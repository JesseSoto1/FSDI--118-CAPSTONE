<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uNFOLLOWEd</title>
</head>

<body>

    <h1>My Blog</h1>

    {% for post in posts %}

        <article>
            <h2>
                <a href="{% url 'post_detail' post.pk %}">
                {{ post.title }}
                </a>
            </h2

            <p>
                By {{ post.author.username }}
            </p>

            <p>
                {{ post.content }}
            </p>

            <p>
                Posted on {{ post.created_at }}
            </p>
        </article>

        <hr>

    {% empty %}

        <p>No posts yet.</p>

    {% endfor %}

</body>
</html>
