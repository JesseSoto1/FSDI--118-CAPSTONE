{% extends 'base.html' %}

{% block content %}
<h2>Log In</h2>
<div class="create-page">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log In</button>
    </form>

    <p>Don't have an account?
        <a href="{% url 'signup' %}">Sign up</a>
    </p>
</div>
{% endblock %}
